<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داشبورد تریدر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2eee3;--card:#fff;--ink:#111;--mut:#5b5b55;--line:rgba(17,17,17,.15);--bk:#111;--shc:#111;--acc:#ff5a1f;--hl:#ffd60a;--mk:#ffd60a;--win:#0a8f55;--loss:#e0281d;--soft:#f6f2e7;--onacc:#111;--t1:#fff1a8;--t2:#ffd9c7;--t3:#d3f3e1;--t4:#dbe6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0c;--card:#181816;--ink:#f4f0e6;--mut:#a29f94;--line:rgba(244,240,230,.17);--bk:#f4f0e6;--shc:#ff5a1f;--mk:rgba(255,90,31,.6);--win:#3dff9e;--loss:#ff6b5b;--soft:#222220;--t1:#2b2710;--t2:#2e1a12;--t3:#102a1c;--t4:#121c30}}
:root[data-theme="dark"]{--bg:#0d0d0c;--card:#181816;--ink:#f4f0e6;--mut:#a29f94;--line:rgba(244,240,230,.17);--bk:#f4f0e6;--shc:#ff5a1f;--mk:rgba(255,90,31,.6);--win:#3dff9e;--loss:#ff6b5b;--soft:#222220;--t1:#2b2710;--t2:#2e1a12;--t3:#102a1c;--t4:#121c30}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(var(--line) 1.2px,transparent 1.5px) 0 0/10px 10px;opacity:.6}
.wrap{position:relative;max-width:1300px;margin:0 auto;padding:20px 20px 60px}
h1{display:flex;align-items:center;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-1px;line-height:1.15;margin:4px 0 20px}
.logo{width:24px;height:24px;border:3px solid var(--bk);background:var(--acc);border-radius:7px;box-shadow:4px 4px 0 var(--shc);transform:rotate(-8deg);margin-inline-end:18px;flex:none}
h2{display:inline-block;font-size:17px;font-weight:800;margin:0 0 14px;padding:0 4px;background:linear-gradient(transparent 58%,var(--mk) 58%)}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:700}
.win{color:var(--win)}.loss{color:var(--loss)}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:2.5px solid var(--bk);border-radius:14px;padding:18px;box-shadow:6px 6px 0 var(--shc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:var(--card);border:2.5px solid var(--bk);border-radius:14px;padding:12px 16px;box-shadow:4px 4px 0 var(--shc)}
.grid>.stat:nth-child(4n+1){background:var(--t1)}.grid>.stat:nth-child(4n+2){background:var(--t2)}.grid>.stat:nth-child(4n+3){background:var(--t3)}.grid>.stat:nth-child(4n){background:var(--t4)}
.stat span{font-size:12px;font-weight:700;color:var(--mut)}.stat b{display:block;font-size:24px;font-weight:800;margin-top:2px}
.chip{background:var(--card);color:var(--ink);border:2px solid var(--bk);border-radius:10px;padding:4px 14px;font:inherit;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--shc);transition:transform .08s,box-shadow .08s}
.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shc)}.chip:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shc)}
.chip.on{background:var(--hl);color:#111}
.accs{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn,.hbtn{background:var(--acc);color:#111;border:2.5px solid var(--bk);border-radius:12px;padding:8px 20px;font:inherit;font-weight:800;cursor:pointer;box-shadow:4px 4px 0 var(--shc);transition:transform .08s,box-shadow .08s}
.btn:hover,.hbtn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shc)}.btn:active,.hbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shc)}
.btn.g{background:var(--card);color:var(--ink)}.btn.d{background:var(--loss);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
.hbtn{margin-top:12px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--bk);border-radius:10px;padding:7px 11px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:0;box-shadow:4px 4px 0 var(--acc)}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{background:var(--bk);color:var(--bg);font-weight:700;font-size:12px;padding:8px;text-align:right;white-space:nowrap}th:first-child{border-radius:0 8px 0 0}th:last-child{border-radius:8px 0 0 0}
td{padding:8px;text-align:right;border-bottom:1.5px dashed var(--line);white-space:nowrap}tr:hover td{background:var(--soft)}
.tr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.tag{display:inline-block;background:var(--t1);border:1.5px solid var(--bk);color:var(--ink);border-radius:6px;padding:0 8px;font-size:12px;font-weight:700;margin-inline-end:4px}
.seg{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.empty{text-align:center;color:var(--mut);padding:30px 10px;font-weight:700}
.bar{height:14px;background:var(--card);border:2px solid var(--bk);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--acc) 0 10px,#ff8a50 10px 20px);background-size:28px 28px;animation:mv 1s linear infinite;border-inline-end:2px solid var(--bk)}
@keyframes mv{to{background-position:28px 0}}
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;background:var(--hl);color:#111;border:3px solid var(--bk);border-radius:18px;padding:30px 28px 24px;box-shadow:8px 8px 0 var(--shc)}
.hero::after{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:repeating-linear-gradient(135deg,#111 0 8px,transparent 8px 16px);pointer-events:none}
.hl{font-size:13px;font-weight:700;letter-spacing:.3px;opacity:.8}
.hb{font:800 clamp(40px,8vw,76px)/1.1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:-3px}.hb small{font-size:.3em;font-weight:700;opacity:.7;letter-spacing:0}
.hs{font-weight:700}.hero .win{color:#056b3d}.hero .loss{color:#a8160d}
.hero .bar{background:rgba(17,17,17,.15)}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg circle:first-child{stroke:rgba(17,17,17,.18)}.ring svg circle:last-child{stroke:#111}
.hero[style*="background"]{color:#fff}.hero[style*="background"] .ring svg circle:last-child{stroke:#fff}.hero[style*="background"] .ring svg circle:first-child{stroke:rgba(255,255,255,.25)}.hero[style*="background"] .bar{background:rgba(255,255,255,.2)}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}.rt b{font:800 24px 'JetBrains Mono',monospace}.rt span{font-size:11px;font-weight:700}
.wr{background:var(--hl);color:#111;font-weight:700}
.al{background:repeating-linear-gradient(135deg,var(--loss) 0 16px,#b81d14 16px 32px);color:#fff;font-weight:800;animation:shk 3s infinite}
@keyframes shk{0%,92%,100%{transform:none}94%{transform:translateX(-4px)}96%{transform:translateX(4px)}98%{transform:translateX(-2px)}}
.ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.m{background:var(--card);border:2.5px solid var(--bk);border-radius:14px;padding:10px 12px;box-shadow:4px 4px 0 var(--shc)}.m b{display:block}
.m.done,.m.ok{background:var(--t3)}.m.fail{background:var(--t2)}.m.warn{background:var(--t1)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.ch{text-align:center;color:var(--mut);font-size:12px;font-weight:700}
.cc{min-height:56px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:2px 6px;font-size:12px;display:flex;flex-direction:column;justify-content:space-between}.cc small{color:var(--mut)}.cc b{font-size:12px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,20px);grid-auto-columns:20px;gap:4px;direction:ltr}.hm i{border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.bub{border:2px solid var(--bk);border-radius:12px;padding:8px 12px;margin:8px 0;max-width:90%;white-space:pre-wrap}.bub.u{background:var(--soft);margin-inline-start:auto}.bub.a{background:var(--t1)}
.cdx{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#111;padding:20px;background:var(--hl)}
.br{width:150px;height:150px;border-radius:50%;background:var(--acc);border:4px solid #111;box-shadow:8px 8px 0 #111;animation:br 8s ease-in-out infinite;margin-bottom:28px}
@keyframes br{0%,100%{transform:scale(.65)}50%{transform:scale(1.15)}}
.tk{overflow:hidden;background:#111;color:#ffd60a;border:2.5px solid var(--bk);border-radius:12px;box-shadow:5px 5px 0 var(--acc);direction:ltr}
.tkin{display:flex;gap:26px;width:max-content;padding:9px 0;animation:tk 40s linear infinite;font:700 13px 'JetBrains Mono',monospace;white-space:nowrap}.tkin b{color:#f4f0e6}.tkin i{color:var(--acc);font-style:normal}
@keyframes tk{to{transform:translateX(-50%)}}
.tab{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);border:2.5px solid var(--bk);border-radius:12px;padding:9px 11px;font:inherit;font-weight:800;cursor:pointer;box-shadow:4px 4px 0 var(--shc);text-align:right;transition:transform .08s,box-shadow .08s}
.tab::before{display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--bk);border-radius:8px;background:var(--soft);font-size:15px;flex:none}
.tab:nth-child(1)::before{content:"\25c9"}.tab:nth-child(2)::before{content:"\270e"}.tab:nth-child(3)::before{content:"\2317"}.tab:nth-child(4)::before{content:"\21c5"}.tab:nth-child(5)::before{content:"\25d4"}.tab:nth-child(6)::before{content:"\2726"}.tab:nth-child(7)::before{content:"\2699"}
.tab:hover{transform:translate(-1px,-1px)}.tab.on{background:var(--bk);color:var(--bg);transform:translate(4px,4px);box-shadow:0 0 0 var(--shc)}.tab.on::before{background:var(--acc);border-color:var(--acc);color:#111}
#app{display:block}
#app>.tk,#app>.accs,#app>.card{margin-bottom:18px}
.shell{display:flex;gap:22px;align-items:flex-start}
.tabs{flex:0 0 190px;position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.main{flex:1;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.main>*{grid-column:1/-1;min-width:0}
.main>.card{grid-column:auto}
.main>.card:has(table),.main>.card:has(form),.main>.card:has(.cal),.main>.card:has(.hm),.main>.card:has(.bub),.main>.card:has(svg),.main>.card:has(.sc),.main>.card.wr,.main>.card.al,.main>.card.empty{grid-column:1/-1}
@media (max-width:900px){.shell,.main{display:block}.main>*{margin-bottom:18px}
.wrap{padding:14px 12px 120px}
.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;flex-direction:row;overflow-x:auto;gap:4px;background:var(--card);border:2.5px solid var(--bk);border-radius:18px;padding:6px;box-shadow:4px 4px 0 var(--shc)}
.tab{flex:0 0 auto;flex-direction:column;gap:0;padding:4px 10px;font-size:10.5px;border:0;box-shadow:none;border-radius:12px;background:none;line-height:1.4}
.tab::before{border:0;background:none;width:auto;height:auto;font-size:19px}
.tab.on{background:var(--hl);color:#111;transform:none}.tab.on::before{background:none;color:#111}.hero{padding:26px 18px 20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.shell{display:block}.wrap{padding-bottom:130px}
.tabs{position:fixed;top:auto;left:50%;right:auto;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;flex:none;width:max-content;max-width:calc(100% - 20px);flex-direction:row;gap:2px;padding:7px;border-radius:32px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:0 20px 44px -14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;flex-direction:column;gap:2px;min-width:64px;padding:7px 12px 6px;border:0;border-radius:24px;background:none;box-shadow:none;color:var(--ink);font-size:11px;font-weight:600;line-height:1.3;transform:none;opacity:.72;transition:background .25s,opacity .25s,color .25s;text-align:center}
.tab::before{border:0;background:none;width:auto;height:auto;font-size:21px;line-height:1}
.tab:hover{transform:none;opacity:1}
.tab.on{background:rgba(255,255,255,.7);color:var(--acc);opacity:1;transform:none;box-shadow:0 2px 12px rgba(0,0,0,.14),inset 0 1px 0 #fff}
.tab.on::before{background:none;border:0;color:var(--acc)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs{background:rgba(28,28,32,.55);border-color:rgba(255,255,255,.16);box-shadow:0 20px 44px -14px #000,inset 0 1px 0 rgba(255,255,255,.14)}:root:not([data-theme="light"]) .tab.on{background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}}
:root[data-theme="dark"] .tabs{background:rgba(28,28,32,.55);border-color:rgba(255,255,255,.16);box-shadow:0 20px 44px -14px #000,inset 0 1px 0 rgba(255,255,255,.14)}:root[data-theme="dark"] .tab.on{background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="logo"></span>داشبورد معاملاتی من<button class="chip" id="thm" onclick="theme()" style="margin-inline-start:auto;font-size:13px">☀</button></h1>
  <div id="app"></div>
</div>
<script>
</script><div id="cdx" style="display:none"></div><div id="lbx" onclick="lb('')" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:50"></div>
<script>
const DEF='ستاپ|select|بریک‌اوت,پولبک,ریورسال\nاحساس|select|آرام,هیجانی,ترس\nرعایت قوانین|select|بله,خیر';
let S;
try{S=JSON.parse(localStorage.getItem('td1'))}catch(e){}
S=S||{accs:[],trades:[],sel:null,tab:'ov',per:'d'};S.wd=S.wd||[];S.ci=S.ci||{};if(S.ui!=='v3'){S.th='light';S.ui='v3'}
const save=()=>{S.ts=Date.now();try{localStorage.setItem('td1',JSON.stringify(S))}catch(e){}if(S.auto){clearTimeout(save.t);save.t=setTimeout(pushCloud,3000)}};
const today=()=>new Date().toLocaleDateString('sv');
const num=(v,d=2)=>Number(v).toLocaleString('en-US',{maximumFractionDigits:d});
const cl=v=>v>0?'win':v<0?'loss':'';
const sg=v=>(v>0?'+':'')+num(v);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=(d,o)=>new Date(d+'T00:00').toLocaleDateString('fa-IR-u-nu-latn-ca-persian',o||{});
const A=()=>S.accs.find(a=>a.id==S.sel);
const T=a=>S.trades.filter(t=>t.acc==a.id).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.id-y.id);
const W=a=>S.wd.filter(w=>w.acc==a.id&&w.k!='d'),D=a=>S.wd.filter(w=>w.acc==a.id&&w.k=='d');
const bal=(a,before)=>a.start+T(a).filter(t=>!before||t.date<before).reduce((s,t)=>s+t.pl,0)-W(a).filter(w=>!before||w.date<before).reduce((s,w)=>s+w.amt,0)+D(a).filter(w=>!before||w.date<before).reduce((s,w)=>s+w.amt,0);
const parseF=txt=>txt.split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const p=l.split('|');return{k:'f'+i,label:p[0].trim(),type:(p[1]||'text').trim(),opts:(p[2]||'').split(',').map(x=>x.trim()).filter(Boolean)}});
const fToTxt=a=>a.fields.map(f=>[f.label,f.type,f.opts.join(',')].join('|').replace(/\|$/,'')).join('\n');

function addAcc(){
  const n=document.getElementById('newname').value.trim();if(!n)return;
  const a={id:Date.now()+'',name:n,cur:'$',start:1000,goal:1,days:5,risk:1,fields:parseF(DEF)};
  S.accs.push(a);S.sel=a.id;S.tab='set';save();render();
}
function pick(id){S.sel=id;save();render()}
function tab(t){PRE=null;S.tab=t;save();render()}
function per(p){S.per=p;save();render()}

function saveSet(e){
  e.preventDefault();const a=A(),g=id=>document.getElementById(id).value;
  a.name=g('s_name')||a.name;a.cur=g('s_cur');a.start=+g('s_start')||0;a.goal=+g('s_goal')||0;
  a.days=Math.min(7,Math.max(1,+g('s_days')||5));a.risk=+g('s_risk')||0;a.loss=+g('s_loss')||0;a.type=g('s_type');a.pt=+g('s_pt')||0;a.mdd=+g('s_mdd')||0;a.mind=+g('s_mind')||0;a.split=+g('s_split')||80;a.mt=+g('s_mt')||0;a.th1=g('s_th1');a.th2=g('s_th2');a.ps=g('s_ps');a.pd=+g('s_pd')||0;a.cl=+g('s_cl')||0;a.ck=g('s_ck').split('\n').map(x=>x.trim()).filter(Boolean);a.fields=parseF(g('s_fields'));
  save();S.tab='ov';render();
}
let armed=false;
function delAcc(){
  if(!armed){armed=true;document.getElementById('delbtn').textContent='برای تأیید حذف دوباره کلیک کنید';return}
  armed=false;S.trades=S.trades.filter(t=>t.acc!=S.sel);S.wd=S.wd.filter(w=>w.acc!=S.sel);S.accs=S.accs.filter(a=>a.id!=S.sel);S.sel=S.accs[0]?.id||null;save();render();
}
function addTrade(e){
  e.preventDefault();const a=A(),g=id=>document.getElementById(id).value;
  const pl=parseFloat(g('t_pl'));if(isNaN(pl))return;
  const x={};a.fields.forEach(f=>x[f.k]=g('x_'+f.k));
  const o={id:S.edit||Date.now(),acc:a.id,date:g('t_date')||today(),sym:g('t_sym'),side:g('t_side'),pl,note:g('t_note'),x,time:g('t_time'),en:g('t_en')===''?null:+g('t_en'),sl:g('t_sl')===''?null:+g('t_sl'),tp:g('t_tp')===''?null:+g('t_tp'),vol:g('t_vol')===''?null:+g('t_vol'),ck:(a.ck||[]).map((c,i)=>document.getElementById('k_'+i).checked),ok:(a.ck||[]).length?(a.ck||[]).every((c,i)=>document.getElementById('k_'+i).checked):null};o.inp=g('t_inp')!='نه';if(!o.inp)o.ok=false;const old=S.trades.find(t=>t.id==S.edit);if(old&&old.img)o.img=old.img;const fi=CAP.as&&document.getElementById('t_img')&&document.getElementById('t_img').files[0];if(fi)upImg(fi,o);const i=S.trades.findIndex(t=>t.id==S.edit);if(i>=0)S.trades[i]=o;else S.trades.push(o);S.edit=0;PRE=null;
  save();render();
}
function delTrade(id){const tt=S.trades.find(t=>t.id==id);if(tt&&tt.img&&CAP.as)CAP.as.delete(tt.img.id).catch(()=>{});S.trades=S.trades.filter(t=>t.id!=id);save();render()}

function pkey(d,p){
  if(p=='d')return d;
  if(p=='m')return d.slice(0,7);
  if(p=='y')return d.slice(0,4);
  const x=new Date(d+'T00:00');x.setDate(x.getDate()-(x.getDay()+1)%7);return x.toLocaleDateString('sv');
}
function plabel(k,p){
  if(p=='d')return pd(k,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  if(p=='w')return 'هفته از '+pd(k,{day:'numeric',month:'short'});
  if(p=='m')return pd(k+'-15',{month:'long',year:'numeric'});
  return pd(k+'-06-15',{year:'numeric'});
}

function overview(a){

 const pp=d=>{const o={};new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{month:'numeric',day:'numeric'}).formatToParts(d).forEach(p=>o[p.type]=+p.value);return{m:o.month,d:o.day}};
 const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},f1=d=>addD(d,1-pp(d).d);
 let first=new Date();first.setHours(12,0,0,0);first=f1(first);let off=S.cm||0;
 for(;off>0;off--)first=f1(addD(first,31));for(;off<0;off++)first=f1(addD(first,-1));
 const days=[];for(let d=first;pp(d).m==pp(first).m;d=addD(d,1))days.push(d);
 const m={};ts.forEach(t=>m[t.date]=(m[t.date]||0)+t.pl);
 const tot=days.reduce((s,d)=>s+(m[d.toLocaleDateString('sv')]||0),0);
 let cells='ش ی د س چ پ ج'.split(' ').map(x=>`<div class="ch">${x}</div>`).join('')+'<div></div>'.repeat((first.getDay()+1)%7);
 days.forEach(d=>{const v=m[d.toLocaleDateString('sv')];cells+=`<div class="cc" style="${v>0?'background:color-mix(in srgb,var(--win) 28%,var(--card))':v<0?'background:color-mix(in srgb,var(--loss) 28%,var(--card))':''}"><small>${pp(d).d}</small><b class="n ${cl(v||0)}">${v!==undefined?sg(Math.round(v)):''}</b></div>`});
 h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="margin:0">تقویم سود و زیان — ${pd(dk(first),{month:'long',year:'numeric'})}</h2><span><button class="chip" onclick="cmv(-1)">قبلی</button> <button class="chip" onclick="cmv(1)">بعدی</button></span></div><div class="mut" style="margin-bottom:6px">جمع ماه: <b class="n ${cl(tot)}">${sg(tot)} ${E(a.cur)}</b></div><div class="cal">${cells}</div></div>`;
 return h}
function dk(d){return d.toLocaleDateString('sv')}
function journal(a){
  const e=S.trades.find(t=>t.id==S.edit&&t.acc==a.id)||PRE||{x:{}};
  const inp=f=>{const v=(e.x||{})[f.k]||'';return f.type=='select'?`<select id="x_${f.k}"><option value="">—</option>${f.opts.map(o=>`<option ${o==v?'selected':''}>${E(o)}</option>`).join('')}</select>`:`<input id="x_${f.k}" type="${f.type=='number'?'number':'text'}" step="any" value="${E(v)}">`};
  let h=`<div class="card"><h2>${e.id?'ویرایش معامله':'ثبت معامله'} — ژورنال ${E(a.name)}</h2><form onsubmit="addTrade(event)">
   <div class="f"><div><label>تاریخ</label><input id="t_date" type="date" value="${e.date||today()}"></div>
   <div><label>نماد</label><input id="t_sym" placeholder="EURUSD" value="${E(e.sym)}"></div>
   <div><label>جهت</label><select id="t_side"><option>خرید</option><option ${e.side=='فروش'?'selected':''}>فروش</option></select></div>
   <div><label>سود/زیان (${E(a.cur)}، منفی = ضرر)</label><input id="t_pl" type="number" step="any" required value="${e.pl??''}"></div></div>
   <div class="f"><div><label>ساعت</label><input id="t_time" type="time" value="${e.time||new Date().toTimeString().slice(0,5)}"></div><div><label>قیمت ورود</label><input id="t_en" type="number" step="any" value="${e.en??''}"></div><div><label>حد ضرر</label><input id="t_sl" type="number" step="any" value="${e.sl??''}"></div><div><label>حد سود</label><input id="t_tp" type="number" step="any" value="${e.tp??''}"></div><div><label>حجم (لات)</label><input id="t_vol" type="number" step="any" value="${e.vol??''}"></div></div>
   ${a.fields.length?`<div class="f">${a.fields.map(f=>`<div><label>${E(f.label)}</label>${inp(f)}</div>`).join('')}</div>`:''}
   ${(a.ck||[]).length?`<div class="card" style="background:var(--soft);padding:10px 14px"><b>چک‌لیست قبل از معامله</b>${a.ck.map((c,i)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:4px 0"><input type="checkbox" id="k_${i}" style="width:auto" ${(e.ck||[])[i]?'checked':''}>${E(c)}</label>`).join('')}</div>`:''}
   <div style="margin-bottom:10px"><label>یادداشت</label><textarea id="t_note" rows="2">${E(e.note)}</textarea></div>
   ${CAP.as?`<div style="margin-bottom:10px"><label>اسکرین‌شات چارت (اختیاری)</label><input type="file" id="t_img" accept="image/*"></div>`:''}<div style="margin-bottom:10px"><label>این معامله در برنامه‌ی امروز بود؟</label><select id="t_inp"><option>بله</option><option ${e.inp===false?'selected':''}>نه</option></select></div><button class="btn">${e.id?'ذخیره ویرایش':'ثبت معامله'}</button>${e.id?' <button type="button" class="btn g" onclick="editT(0)">انصراف</button>':''}</form></div>`;
  const ts=T(a).reverse();
  h+=`<div class="card"><h2>معاملات ثبت‌شده</h2>`;
  if(!ts.length)h+='<div class="empty">ژورنال خالی است.</div>';
  ts.forEach(t=>{
    const tags=(outW(a,t)?'<span class="tag" style="color:var(--loss)">خارج از ساعت</span>':'')+(t.ok===false?'<span class="tag" style="color:var(--loss)">خارج از قوانین</span>':'')+(rr(t)?`<span class="tag">RR ${rr(t)}</span>`:'')+(t.time?`<span class="tag">${E(t.time)}</span>`:'')+a.fields.map(f=>t.x&&t.x[f.k]?`<span class="tag">${E(f.label)}: ${E(t.x[f.k])}</span>`:'').join('');
    h+=`<div class="tr"><div><b>${E(t.sym)||'—'}</b> <span class="mut">${E(t.side)} · ${pd(t.date,{day:'numeric',month:'short',year:'numeric'})}</span><div>${tags}</div>${t.note?`<div class="mut">${E(t.note)}</div>`:''}${t.img?`<img src="${t.img.url}" onclick="lb(this.src)" style="height:56px;border-radius:6px;margin-top:4px;cursor:pointer">`:''}</div>
    <div style="text-align:left;white-space:nowrap"><b class="n ${cl(t.pl)}">${sg(t.pl)}</b><br><button class="chip" style="padding:0 10px;font-size:12px" onclick="editT(${t.id})">ویرایش</button> <button class="chip" style="padding:0 10px;font-size:12px" onclick="delTrade(${t.id})">حذف</button></div></div>`});
  return h+'</div>';
}

function settings(a){
  return`<div class="card"><h2>تنظیمات اکانت</h2><form onsubmit="saveSet(event)">
  <div class="f"><div><label>نام اکانت</label><input id="s_name" value="${E(a.name)}"></div>
  <div><label>واحد پول</label><input id="s_cur" value="${E(a.cur)}"></div>
  <div><label>موجودی اولیه</label><input id="s_start" type="number" step="any" value="${a.start}"></div>
  <div><label>هدف سود روزانه (%)</label><input id="s_goal" type="number" step="any" value="${a.goal}"></div>
  <div><label>روز معاملاتی در هفته</label><input id="s_days" type="number" min="1" max="7" value="${a.days}"></div>
  <div><label>ریسک هر معامله (%)</label><input id="s_risk" type="number" step="any" value="${a.risk}"></div>
  <div><label>سقف ضرر روزانه (%)</label><input id="s_loss" type="number" step="any" value="${a.loss||0}"></div>
  <div><label>نوع اکانت</label><select id="s_type">${[['personal','شخصی'],['prop','چالش پراپ'],['funded','ریل / فاند']].map(([k,l])=>`<option value="${k}" ${(a.type||'personal')==k?'selected':''}>${l}</option>`).join('')}</select></div>
  <div><label>پراپ: هدف سود فاز (%)</label><input id="s_pt" type="number" step="any" value="${a.pt||''}"></div>
  <div><label>پراپ: حداکثر دراوداون کل (%)</label><input id="s_mdd" type="number" step="any" value="${a.mdd||''}"></div>
  <div><label>پراپ: حداقل روز معاملاتی</label><input id="s_mind" type="number" value="${a.mind||''}"></div>
  <div><label>ریل: سهم تو از سود (%)</label><input id="s_split" type="number" step="any" value="${a.split||80}"></div>
  <div><label>حداکثر معامله در روز</label><input id="s_mt" type="number" value="${a.mt||''}"></div>
  <div><label>هشدار بعد از چند باخت متوالی</label><input id="s_cl" type="number" value="${a.cl||''}"></div>
  <div><label>ساعت شروع مجاز معامله</label><input id="s_th1" type="time" value="${a.th1||''}"></div><div><label>ساعت پایان مجاز</label><input id="s_th2" type="time" value="${a.th2||''}"></div><div><label>پراپ: تاریخ شروع چالش</label><input id="s_ps" type="date" value="${a.ps||''}"></div><div><label>پراپ: مهلت چالش (روز)</label><input id="s_pd" type="number" value="${a.pd||''}"></div>
  <div style="grid-column:1/-1"><label>چک‌لیست قبل از معامله — هر خط یک مورد</label><textarea id="s_ck" rows="3">${E((a.ck||[]).join('\n'))}</textarea></div></div>
  <div style="margin-bottom:10px"><label>فیلدهای ژورنال این اکانت — هر خط: نام|نوع|گزینه‌ها (نوع: text, number, select)</label>
  <textarea id="s_fields" rows="5" style="direction:rtl">${E(fToTxt(a))}</textarea></div>
  <button class="btn">ذخیره</button> <button type="button" id="delbtn" class="btn d" onclick="delAcc()">حذف اکانت</button></form></div>
  <div class="card"><h2>بکاپ و انتقال داده</h2><div class="mut" style="margin-bottom:8px">بکاپ کامل (همه‌ی اکانت‌ها) را کپی و جایی امن ذخیره کن. برای بازگردانی، متن بکاپ را اینجا بچسبان.</div>
  ${cloudUI()}<textarea id="bk" rows="5" style="direction:ltr"></textarea>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn g" onclick="bk('j')">نمایش بکاپ کامل</button><button class="btn g" onclick="bk('c')">CSV معاملات این اکانت</button><button class="btn" onclick="bk('r')">بازگردانی از متن</button></div></div>`;
}

function render(){
  const a=A();
  applyTheme();ensureCD();let h=ticker()+banners()+`<div class="accs">${S.accs.map(x=>`<button class="chip ${x.id==S.sel?'on':''}" onclick="pick('${x.id}')">${E(x.name)}</button>`).join('')}
   <span style="display:flex;gap:6px"><input id="newname" placeholder="نام اکانت جدید" style="width:150px;border-radius:99px" onkeydown="if(event.key=='Enter')addAcc()"><button class="chip" onclick="addAcc()">+ افزودن</button></span></div>`;
  if(!a)h+='<div class="card empty">برای شروع، یک اکانت اضافه کنید (مثلاً «پراپ ۱۰۰۰۰» یا «اکانت شخصی»).</div>';
  else{
    h+=`<div class="shell"><div class="tabs">${[['ov','نمای کلی'],['jr','ژورنال'],['cc','ماشین‌حساب'],['wd','واریز و برداشت'],['an','تحلیل'],['co','مربی'],['set','تنظیمات']].map(([k,l])=>`<button class="tab ${S.tab==k?'on':''}" onclick="tab('${k}')">${l}</button>`).join('')}</div>`;
    h+='<div class="main">'+(S.tab=='jr'?journal(a):S.tab=='wd'?wdTab(a):S.tab=='an'?analytics(a):S.tab=='cc'?entryCalc(a):S.tab=='co'?coachPro(a):S.tab=='set'?settings(a)+importCard(a):overview(a))+'</div></div>';
  }
  document.getElementById('app').innerHTML=h;
}
render();
</script>
</body>
